services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: back_end_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BackEnd
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/back_end_development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY}
      PORT: "3000"
      BINDING: "0.0.0.0"
      RAILS_LOG_LEVEL: info
    volumes:
      - ./BackEnd:/rails
      - bundle:/usr/local/bundle
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./FrontEnd
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  bundle:
